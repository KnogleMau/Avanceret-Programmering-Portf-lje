N<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Dijkstra — Vejnet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { font-size: 1.4rem; margin-bottom: 6px; color: #a0c4ff; letter-spacing: 2px; }
        p.sub { font-size: 0.75rem; color: #666; margin-bottom: 16px; }

        #canvas-wrap { position: relative; }
        canvas { border-radius: 12px; background: #0f0f1e; display: block; }

        #controls {
            margin-top: 14px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        button {
            background: #a0c4ff22;
            border: 1px solid #a0c4ff55;
            color: #a0c4ff;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        button:hover { background: #a0c4ff44; }

        #log {
            margin-top: 16px;
            width: 720px;
            max-height: 180px;
            overflow-y: auto;
            background: #0f0f1e;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.75rem;
            line-height: 1.7;
            border: 1px solid #a0c4ff22;
        }
        .log-entry { color: #88c; }
        .log-entry.visited { color: #5de095; }
        .log-entry.found { color: #ffd166; font-weight: bold; }

        #speed-wrap { font-size: 0.75rem; color: #666; display: flex; align-items: center; gap: 8px; }
        input[type=range] { accent-color: #a0c4ff; }

        #legend {
            margin-top: 12px;
            display: flex;
            gap: 18px;
            font-size: 0.7rem;
            color: #888;
        }
        .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    </style>
</head>
<body>
<h1>DIJKSTRA — VEJNET</h1>
<p class="sub">Korteste vej fra Aarhus til Odense — afstande i km</p>

<div id="canvas-wrap">
    <canvas id="c" width="720" height="440"></canvas>
</div>

<div id="legend">
    <span><span class="swatch" style="background:#1D9E75"></span>Start</span>
    <span><span class="swatch" style="background:#D85A30"></span>Mål</span>
    <span><span class="swatch" style="background:#a0c4ff"></span>I kø</span>
    <span><span class="swatch" style="background:#5de095"></span>Visited (låst)</span>
    <span><span class="swatch" style="background:#ffd166"></span>Korteste vej</span>
</div>

<div id="controls">
    <button id="btn">▶ Start</button>
    <button id="reset">↺ Reset</button>
    <div id="speed-wrap">
        Hastighed: <input type="range" id="speed" min="1" max="10" value="4">
    </div>
</div>

<div id="log"><span style="color:#444">Tryk Start for at begynde...</span></div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const log = document.getElementById('log');

    // Byer placeret som et stiliseret Danmarkskort (Jylland til venstre, Fyn til højre)
    const nodes = {
        Aarhus:      { x: 230, y: 60,  dist: Infinity, prev: null, visited: false, inQueue: false },
        Silkeborg:   { x: 90,  y: 130, dist: Infinity, prev: null, visited: false, inQueue: false },
        Skanderborg: { x: 230, y: 145, dist: Infinity, prev: null, visited: false, inQueue: false },
        Horsens:     { x: 230, y: 230, dist: Infinity, prev: null, visited: false, inQueue: false },
        Vejle:       { x: 200, y: 305, dist: Infinity, prev: null, visited: false, inQueue: false },
        Fredericia:  { x: 340, y: 305, dist: Infinity, prev: null, visited: false, inQueue: false },
        Kolding:     { x: 170, y: 380, dist: Infinity, prev: null, visited: false, inQueue: false },
        Esbjerg:     { x: 50,  y: 380, dist: Infinity, prev: null, visited: false, inQueue: false },
        Middelfart:  { x: 470, y: 305, dist: Infinity, prev: null, visited: false, inQueue: false },
        Odense:      { x: 610, y: 305, dist: Infinity, prev: null, visited: false, inQueue: false },
    };

    // Rettede vægtede kanter (km)
    const edges = [
        ['Aarhus','Skanderborg',25],
        ['Aarhus','Silkeborg',45],
        ['Silkeborg','Vejle',60],
        ['Skanderborg','Silkeborg',30],
        ['Skanderborg','Horsens',25],
        ['Horsens','Vejle',30],
        ['Horsens','Fredericia',50],
        ['Vejle','Fredericia',25],
        ['Vejle','Kolding',25],
        ['Fredericia','Middelfart',20],
        ['Kolding','Middelfart',40],
        ['Kolding','Esbjerg',70],
        ['Middelfart','Odense',25],
        ['Esbjerg','Odense',140],
    ];

    const SOURCE = 'Aarhus';
    const TARGET = 'Odense';

    // Adjacency list
    const adj = {};
    for (const k of Object.keys(nodes)) adj[k] = [];
    for (const [a,b,w] of edges) adj[a].push([b,w]);

    let steps = [];
    let stepIdx = 0;
    let animTimer = null;
    let running = false;
    let path = [];

    function buildSteps() {
        for (const k of Object.keys(nodes)) {
            nodes[k].dist = Infinity;
            nodes[k].prev = null;
            nodes[k].visited = false;
            nodes[k].inQueue = false;
        }
        steps = [];
        path = [];

        const dist = {};
        const prev = {};
        const visited = new Set();
        for (const k of Object.keys(nodes)) dist[k] = Infinity;
        dist[SOURCE] = 0;

        const queue = [[SOURCE, 0]];
        steps.push({ type: 'init', node: SOURCE, dist: 0 });

        while (queue.length > 0) {
            queue.sort((a,b) => a[1]-b[1]);
            const [cur, curDist] = queue.shift();
            if (visited.has(cur)) continue;
            visited.add(cur);
            steps.push({ type: 'visit', node: cur, dist: curDist });
            if (cur === TARGET) break;
            for (const [nb, w] of adj[cur]) {
                if (visited.has(nb)) continue;
                const nd = curDist + w;
                if (nd < dist[nb]) {
                    const old = dist[nb];
                    dist[nb] = nd;
                    prev[nb] = cur;
                    queue.push([nb, nd]);
                    steps.push({ type: 'update', node: nb, dist: nd, from: cur, oldDist: old });
                }
            }
        }

        let cur = TARGET;
        while (cur) { path.unshift(cur); cur = prev[cur]; }
        steps.push({ type: 'done', path, total: dist[TARGET] });
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);

        // Edges
        for (const [a,b,w] of edges) {
            const na = nodes[a], nb = nodes[b];
            const onPath = steps[stepIdx-1]?.type === 'done' && path.length > 1 &&
                path.includes(a) && path.includes(b) &&
                path.indexOf(a) + 1 === path.indexOf(b);

            ctx.beginPath();
            ctx.moveTo(na.x, na.y);
            ctx.lineTo(nb.x, nb.y);
            ctx.strokeStyle = onPath ? '#ffd16688' : '#ffffff18';
            ctx.lineWidth = onPath ? 3 : 1.5;
            ctx.stroke();

            // Pil ved midten af vejen
            const angle = Math.atan2(nb.y-na.y, nb.x-na.x);
            const mx = (na.x+nb.x)/2, my = (na.y+nb.y)/2;
            ctx.fillStyle = onPath ? '#ffd166aa' : '#ffffff44';
            ctx.beginPath();
            ctx.moveTo(mx + Math.cos(angle)*7, my + Math.sin(angle)*7);
            ctx.lineTo(mx + Math.cos(angle-2.4)*6, my + Math.sin(angle-2.4)*6);
            ctx.lineTo(mx + Math.cos(angle+2.4)*6, my + Math.sin(angle+2.4)*6);
            ctx.fill();

            // Vægt-label (km) — placér lidt forskudt så den ikke ligger oven i pilen
            const offX = -Math.sin(angle) * 10;
            const offY = Math.cos(angle) * 10;
            ctx.fillStyle = '#ffffff77';
            ctx.font = '11px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(w, mx + offX, my + offY + 3);
        }

        // Noder (byer)
        for (const [k, n] of Object.entries(nodes)) {
            let fill = '#1a1a3e';
            let stroke = '#ffffff33';
            let textCol = '#aaa';

            if (k === SOURCE) { fill = '#1D9E75'; stroke = '#1D9E75'; textCol = '#fff'; }
            else if (k === TARGET) { fill = '#D85A30'; stroke = '#D85A30'; textCol = '#fff'; }
            else if (n.visited) { fill = '#5de09533'; stroke = '#5de095'; textCol = '#5de095'; }
            else if (n.inQueue) { fill = '#a0c4ff22'; stroke = '#a0c4ff'; textCol = '#a0c4ff'; }

            if (steps[stepIdx-1]?.type === 'done' && path.length > 1 && path.includes(k)) {
                stroke = '#ffd166';
                fill = k === SOURCE ? '#1D9E75' : k === TARGET ? '#D85A30' : '#ffd16622';
                textCol = '#ffd166';
            }

            ctx.beginPath();
            ctx.arc(n.x, n.y, 22, 0, Math.PI*2);
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 2;
            ctx.stroke();

            // Bynavn over noden
            ctx.fillStyle = textCol;
            ctx.font = 'bold 12px Courier New';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(k, n.x, n.y - 32);

            // Aktuel afstand inde i cirklen (km fra start)
            if (n.dist !== Infinity) {
                ctx.fillStyle = textCol;
                ctx.font = 'bold 12px Courier New';
                ctx.fillText(n.dist, n.x, n.y);
            } else {
                ctx.fillStyle = '#555';
                ctx.font = 'bold 14px Courier New';
                ctx.fillText('∞', n.x, n.y);
            }
        }
    }

    function addLog(msg, cls='log-entry') {
        const el = document.createElement('div');
        el.className = cls;
        el.textContent = msg;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
    }

    function applyStep(s) {
        if (s.type === 'init') {
            nodes[SOURCE].dist = 0;
            nodes[SOURCE].inQueue = true;
            addLog(`Start: ${SOURCE} sættes i køen med afstand 0 km`);
        } else if (s.type === 'visit') {
            nodes[s.node].visited = true;
            nodes[s.node].inQueue = false;
            addLog(`✓ Besøger ${s.node} (afstand=${s.dist} km) — låst fast`, 'log-entry visited');
        } else if (s.type === 'update') {
            nodes[s.node].dist = s.dist;
            nodes[s.node].prev = s.from;
            nodes[s.node].inQueue = true;
            const før = s.oldDist === Infinity ? '∞' : s.oldDist + ' km';
            addLog(`  → Afstanden til ${s.node} er nu ${s.dist} km (før ${før}, via ${s.from})`);
        } else if (s.type === 'done') {
            addLog(`★ Korteste vej: ${s.path.join(' → ')}  (i alt ${s.total} km)`, 'log-entry found');
        }
    }

    function runNext() {
        if (stepIdx >= steps.length) {
            running = false;
            document.getElementById('btn').textContent = '✓ Færdig';
            return;
        }
        applyStep(steps[stepIdx]);
        if (steps[stepIdx].type === 'done') path = steps[stepIdx].path;
        stepIdx++;
        draw();
        const delay = 1100 - document.getElementById('speed').value * 100;
        animTimer = setTimeout(runNext, delay);
    }

    document.getElementById('btn').addEventListener('click', () => {
        if (!running) {
            running = true;
            document.getElementById('btn').textContent = '⏸ Kører...';
            runNext();
        }
    });

    document.getElementById('reset').addEventListener('click', () => {
        clearTimeout(animTimer);
        running = false;
        stepIdx = 0;
        path = [];
        log.innerHTML = '<span style="color:#444">Tryk Start for at begynde...</span>';
        document.getElementById('btn').textContent = '▶ Start';
        buildSteps();
        for (const k of Object.keys(nodes)) {
            nodes[k].dist = Infinity;
            nodes[k].visited = false;
            nodes[k].inQueue = false;
        }
        draw();
    });

    buildSteps();
    draw();
</script>
</body>
</html>
